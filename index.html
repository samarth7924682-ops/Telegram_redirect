<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Tipper - Loss Cover</title>
<style>
  :root {
    --pitch: #0b3d2e;
    --pitch-deep: #072a20;
    --cream: #f4ecd8;
    --seam: #d14917;
    --line: rgba(237, 228, 211, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: radial-gradient(circle at 50% -20%, #1a5c46 0%, var(--pitch) 50%, var(--pitch-deep) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--cream);
  }

  .ticket {
    width: 100%;
    max-width: 420px;
    background: rgba(7, 42, 32, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
  }

  .seam {
    height: 6px;
    width: 100%;
    background: repeating-linear-gradient(90deg, var(--seam) 0px, var(--seam) 12px, #8f2d0a 12px, #8f2d0a 24px);
  }

  .content {
    padding: 35px 25px;
    text-align: center;
  }

  .badge {
    background: rgba(209, 73, 23, 0.2);
    color: #ff8a5c;
    border: 1px solid rgba(209, 73, 23, 0.4);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 50px;
    display: inline-block;
    margin-bottom: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 8px;
    color: #ffffff;
  }

  p.subtitle {
    font-size: 15px;
    color: #b0c4b1;
    margin-bottom: 25px;
    font-weight: 500;
  }

  /* Professional Highlights Box */
  .features {
    text-align: left;
    background: rgba(0, 0, 0, 0.25);
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 25px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .features p {
    font-size: 15px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #e2e8f0;
    font-weight: 600;
  }

  .features p:last-child { margin-bottom: 0; }
  
  .features span {
    background: #22c55e;
    color: #000;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    font-weight: bold;
    flex-shrink: 0;
  }

  .loader {
    width: 35px;
    height: 35px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    border-top-color: var(--seam);
    animation: spin 1s linear infinite;
    margin: 0 auto 20px auto;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .btn-telegram {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(135deg, #0088cc, #00a2ed);
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    padding: 15px 24px;
    border-radius: 8px;
    transition: all 0.3s ease;
    box-shadow: 0 8px 16px rgba(0, 136, 204, 0.3);
  }

  .btn-telegram:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 20px rgba(0, 136, 204, 0.4);
  }

  .btn-telegram svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .redirect-text {
    font-size: 13px;
    color: #8a967f;
    margin-top: 15px;
  }
</style>

<!-- Fast Auto Redirect Script -->
<script>
    setTimeout(function() {
        window.location.href = "https://t.me/RakeshReddy786";
    }, 500); // 0.5 seconds delay - page khulte hi turant redirect
</script>

</head>
<body>

  <div class="ticket">
    <div class="seam"></div>
    <div class="content">
      <span class="badge">VIP Analysis</span>
      <h1>Personal Tipper</h1>
      <p class="subtitle">Match loss cover karne ke liye sahi guidance</p>
      
      <div class="features">
        <p><span>✓</span> FEES AFTER WIN (मैच जीतने के बाद फीस)</p>
        <p><span>✓</span> No Upfront Fees / No Advance</p>
        <p><span>✓</span> Aiming to help people 100%</p>
      </div>

      <div class="loader"></div>

      <a href="https://t.me/RakeshReddy786" class="btn-telegram">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .54-1.42.53-.47-.01-1.37-.26-2.05-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.05-.75 4.12-1.79 6.87-2.97 8.26-3.55 3.93-1.63 4.74-1.92 5.27-1.93.12 0 .37.03.54.17.14.12.18.28.2.45-.02.07-.02.16-.04.28z"/>
        </svg>
        Message @RakeshReddy786
      </a>
      
      <p class="redirect-text"></p>
    </div>
  </div>

</body>
</html>
